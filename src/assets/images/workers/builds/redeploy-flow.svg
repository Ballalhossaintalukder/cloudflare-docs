<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 820 100"><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.step-num{font-size:11px;font-weight:700;fill:#fff}.step-label{font-size:13px;font-weight:600;fill:#1a1a1a}.step-sub{font-size:12px;fill:#555}.box{fill:#f8f9fa;stroke:#d0d5dd;stroke-width:1.5;rx:8}.pill{fill:#f6821f;rx:10;ry:10}.arrow{stroke:#d0d5dd;stroke-width:1.5;fill:none;marker-end:url(#arw)}</style><defs><marker id="arw" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><polygon fill="#d0d5dd" points="0 0 8 3 0 6"/></marker></defs><rect width="240" height="80" x="10" y="8" class="box"/><rect width="52" height="20" x="26" y="22" class="pill"/><text x="52" y="36" class="step-num" text-anchor="middle">Step 1</text><text x="86" y="36" class="step-label">Get active deployment</text><text x="26" y="62" class="step-sub">Find current version ID</text><line x1="250" x2="286" y1="48" y2="48" class="arrow"/><rect width="240" height="80" x="294" y="8" class="box"/><rect width="52" height="20" x="310" y="22" class="pill"/><text x="336" y="36" class="step-num" text-anchor="middle">Step 2</text><text x="370" y="36" class="step-label">Find the build</text><text x="310" y="62" class="step-sub">Look up by version ID</text><line x1="534" x2="570" y1="48" y2="48" class="arrow"/><rect width="240" height="80" x="578" y="8" class="box"/><rect width="52" height="20" x="594" y="22" class="pill"/><text x="620" y="36" class="step-num" text-anchor="middle">Step 3</text><text x="654" y="36" class="step-label">Retrigger build</text><text x="594" y="62" class="step-sub">Same branch &amp; commit</text></svg>