<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 760 100"><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.step-num{font-size:11px;font-weight:700;fill:#fff}.step-label{font-size:13px;font-weight:600;fill:#1a1a1a}.step-sub{font-size:12px;fill:#555;font-family:&apos;SF Mono&apos;,SFMono-Regular,Consolas,monospace}.box,.box-hl{fill:#f8f9fa;stroke:#d0d5dd;stroke-width:1.5;rx:8}.box-hl{fill:#fff3e6;stroke:#f6821f}.pill{fill:#f6821f;rx:10;ry:10}.arrow{stroke:#d0d5dd;stroke-width:1.5;fill:none;marker-end:url(#arrowhead)}</style><defs><marker id="arrowhead" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><polygon fill="#d0d5dd" points="0 0 8 3 0 6"/></marker></defs><rect width="218" height="80" x="10" y="8" class="box"/><rect width="52" height="20" x="26" y="22" class="pill"/><text x="52" y="36" class="step-num" text-anchor="middle">Step 1</text><text x="86" y="36" class="step-label">Get Worker tag</text><text x="26" y="62" class="step-sub">GET /workers/scripts</text><line x1="228" x2="264" y1="48" y2="48" class="arrow"/><rect width="218" height="80" x="272" y="8" class="box"/><rect width="52" height="20" x="288" y="22" class="pill"/><text x="314" y="36" class="step-num" text-anchor="middle">Step 2</text><text x="348" y="36" class="step-label">Get trigger UUID</text><text x="288" y="62" class="step-sub">GET .../triggers</text><line x1="490" x2="526" y1="48" y2="48" class="arrow"/><rect width="218" height="80" x="534" y="8" class="box-hl"/><rect width="52" height="20" x="550" y="22" class="pill"/><text x="576" y="36" class="step-num" text-anchor="middle">Step 3</text><text x="610" y="36" class="step-label">Build operations</text><text x="550" y="62" class="step-sub">Trigger / List / Logs</text></svg>