<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 820 260"><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,sans-serif}.label{font-size:12px;font-weight:600;fill:#1a1a1a}.phase,.sublabel{font-size:11px}.sublabel{fill:#6b7280}.phase{font-weight:600;fill:#fff}.annotation,.phase-body{fill:#6b7280}.phase-body{font-size:11px}.annotation{font-size:10px}</style><defs><marker id="time-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#d1d5db" points="0 0 8 3 0 6"/></marker></defs><rect width="820" height="260" fill="#fafafa" rx="8"/><line x1="40" x2="720" y1="30" y2="30" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#time-arrow)"/><text x="735" y="34" class="sublabel">time</text><path fill="#f97316" stroke="#ea580c" stroke-width="1" d="M44,52 h76 v36 h-76 q-4,0 -4,-4 v-28 q0,-4 4,-4z"/><text x="80" y="75" class="phase" text-anchor="middle">headers</text><rect width="60" height="36" x="120" y="52" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/><text x="150" y="75" class="phase-body" text-anchor="middle">body</text><rect width="30" height="36" x="180" y="52" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="3 2" stroke-width="1"/><rect width="70" height="36" x="210" y="52" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/><text x="245" y="75" class="phase-body" text-anchor="middle">body</text><rect width="30" height="36" x="280" y="52" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="3 2" stroke-width="1"/><rect width="60" height="36" x="310" y="52" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/><text x="340" y="75" class="phase-body" text-anchor="middle">body</text><rect width="30" height="36" x="370" y="52" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="3 2" stroke-width="1"/><rect width="70" height="36" x="400" y="52" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/><text x="435" y="75" class="phase-body" text-anchor="middle">body</text><rect width="30" height="36" x="470" y="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2" stroke-width="1.5"/><text x="520" y="68" class="label" style="fill:#dc2626">✗</text><text x="538" y="68" class="sublabel" style="fill:#dc2626">canceled</text><line x1="295" x2="295" y1="100" y2="90" stroke="#9ca3af" stroke-width="1"/><text x="295" y="115" class="annotation" text-anchor="middle">brief gaps from gzip decompression</text><text x="295" y="128" class="annotation" text-anchor="middle">or internal buffering</text><text x="40" y="165" class="sublabel">When a 7th connection is opened, a brief gap where there is no I/O makes</text><text x="40" y="180" class="sublabel">the connection appear idle — so it gets canceled, even though the Worker</text><text x="40" y="195" class="sublabel">is still using it.</text><rect width="740" height="32" x="40" y="215" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="6"/><rect width="24" height="14" x="58" y="224" fill="#fff7ed" stroke="#fdba74" stroke-width="1" rx="3"/><text x="89" y="235" class="sublabel">Bytes flowing</text><rect width="24" height="14" x="200" y="224" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="3 2" stroke-width="1" rx="3"/><text x="231" y="235" class="sublabel">Brief pause (appears idle)</text><rect width="24" height="14" x="420" y="224" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2" stroke-width="1" rx="3"/><text x="451" y="235" class="sublabel">Canceled by runtime</text></svg>