<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 820 360"><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,sans-serif}.label{font-size:12px;font-weight:600;fill:#1a1a1a}.phase,.sublabel{font-size:11px}.sublabel{fill:#6b7280}.phase{font-weight:600;fill:#fff}.phase-body{font-size:11px;fill:#0369a1}</style><defs><marker id="time-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#d1d5db" points="0 0 8 3 0 6"/></marker></defs><rect width="820" height="360" fill="#fafafa" rx="8"/><line x1="200" x2="720" y1="48" y2="48" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#time-arrow)"/><text x="735" y="52" class="sublabel">time</text><text x="40" y="95" class="label">Incoming request</text><rect width="140" height="36" x="200" y="76" fill="#f97316" stroke="#ea580c" stroke-width="1" rx="4"/><text x="270" y="99" class="phase" text-anchor="middle">processing</text><text x="40" y="155" class="label">Outbound LLM stream</text><path fill="#eff6ff" stroke="#93c5fd" stroke-width="1" d="M244,136 h316 q4,0 4,4 v28 q0,4 -4,4 h-316 v-36z"/><text x="400" y="159" class="phase-body" text-anchor="middle">streaming tokens</text><text x="570" y="159" class="label" style="fill:#16a34a">✓</text><text x="588" y="159" class="sublabel" style="fill:#16a34a">stream completes</text><text x="40" y="215" class="label">Durable Object</text><path fill="#16a34a" stroke="#15803d" stroke-width="1" d="M204,196 h356 v36 h-356 q-4,0 -4,-4 v-28 q0,-4 4,-4z"/><text x="380" y="219" class="phase" text-anchor="middle">kept alive by outbound connection</text><path fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="4 3" stroke-width="1" d="M560,196 h126 q4,0 4,4 v28 q0,4 -4,4 h-126 v-36z"/><text x="623" y="219" class="sublabel" text-anchor="middle">70-140s idle</text><line x1="560" x2="560" y1="68" y2="244" stroke="#16a34a" stroke-dasharray="4 3" stroke-width="1.5"/><text x="560" y="262" class="sublabel" text-anchor="middle" style="fill:#16a34a">connection closes</text><text x="40" y="295" class="sublabel">The active outbound connection keeps the Durable Object alive until the stream completes</text><text x="40" y="310" class="sublabel">(up to 15 minutes). The inactivity window starts only after the connection closes.</text><rect width="740" height="32" x="40" y="318" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="6"/><rect width="24" height="14" x="58" y="327" fill="#f97316" stroke="#ea580c" stroke-width="1" rx="3"/><text x="89" y="338" class="sublabel">Incoming request</text><rect width="24" height="14" x="240" y="327" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="3"/><text x="271" y="338" class="sublabel">Outbound stream (keeps object alive)</text><rect width="24" height="14" x="500" y="327" fill="#16a34a" stroke="#15803d" stroke-width="1" rx="3"/><text x="531" y="338" class="sublabel">Durable Object alive</text></svg>